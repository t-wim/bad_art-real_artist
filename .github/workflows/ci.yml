name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./.tmp/ci.db"
      NEXTAUTH_SECRET: "ci-nextauth-secret"
      X_CLIENT_ID: "ci-client"
      X_CLIENT_SECRET: "ci-secret"
      X_BEARER: "ci-bearer"
      PRISMA_SKIP_POSTINSTALL: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.2
      - name: Cache Prisma engines
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.prisma
            node_modules/.pnpm/@prisma+client@*/node_modules/.prisma
            node_modules/.pnpm/@prisma+engines@*/node_modules/@prisma/engines/**
          key: ${{ runner.os }}-prisma-${{ hashFiles('pnpm-lock.yaml', 'prisma/schema.prisma') }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PRISMA_SKIP_POSTINSTALL: "1"
      - name: Prisma generate
        run: pnpm prisma:generate
        env:
          PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: "1"
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Job dry-run
        run: pnpm jobs:dry-run
